id: public_records_request
title: 'Public records request'
description: '<p>City Clerk, 100 Main Street. Counter Monday–Friday, 8:30 a.m. to 4:30 p.m. Phone (555) 555-0100.</p>'
categories: {  }
elements: |-
  intro:
    '#type': webform_markup
    '#markup': |
      <p>City Clerk, 100 Main Street. Counter Monday–Friday, 8:30 a.m. to 4:30 p.m. Phone (555) 555-0100.</p>
      <p>This is a records request, not a 911 call and not a pothole report. Send request when you know the meeting date, an address, or the permit number. Copies are picked up at the counter unless you ask for mail.</p>
    '#wrapper_attributes':
      class:
        - civic-hall-contact-intro
  name:
    '#type': textfield
    '#title': 'Your name'
    '#required': true
  email:
    '#type': email
    '#title': Email
    '#required': true
  phone:
    '#type': tel
    '#title': Phone
  record:
    '#type': textarea
    '#title': 'What records'
    '#description': 'Meeting date, an address, or the permit number if you have one.'
    '#required': true
  captcha:
    '#type': captcha
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#submit__label': 'Send request'
