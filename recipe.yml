            }
            .region-header.civic-hall-search-open .views-exposed-form,
            .path-search .region-header .views-exposed-form,
            .region-header:not(:has(.civic-hall-search-toggle)):has(.views-exposed-form:focus-within) .views-exposed-form {
              grid-row: 2;
              width: 100%;
