                max-width: 640px;
              }
            }
            @media (min-width: 768px) {
              .region-header .civic-hall-search-toggle {
                max-width: 768px;
              }
              .region-header .navbar--links {
                margin-right: 2.75rem;
              }
            }
            @media (min-width: 1024px) {
              .region-header .civic-hall-search-toggle {
                max-width: 1024px;
              }
            }
            @media (min-width: 1280px) {
              .region-header .civic-hall-search-toggle {
                max-width: 1280px;
              }
            }
            @media (min-width: 1536px) {
              .region-header .civic-hall-search-toggle {
                max-width: 1536px;
              }
            }
            .path-search .region-header .civic-hall-search-toggle {
              display: none;
            }
            .region-header .views-exposed-form {
              pointer-events: auto;
              box-sizing: border-box;
