        js:
          original: &civic_hall_search_js |-
            (function () {
              function setOpen(header, open) {
                if (!header) {
                  return;
                }
                if (document.body.classList.contains('path-search')) {
                  header.classList.add('civic-hall-search-open');
                  return;
                }
                header.classList.toggle('civic-hall-search-open', open);
                var btn = header.querySelector('.civic-hall-search-toggle');
                if (btn) {
                  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
                }
                var input = header.querySelector('.views-exposed-form input[name="keywords"]');
                if (open && input) {
                  input.focus();
                }
                else if (!open && btn) {
                  btn.focus();
                }
              }
              function setup(form) {
                if (form.getAttribute('data-civic-hall-search')) {
                  return;
                }
                form.setAttribute('data-civic-hall-search', '1');
                var header = form.closest('.region-header');
                if (!header) {
                  return;
                }
                var input = form.querySelector('input[name="keywords"]');
                if (input) {
                  if (!input.id) {
                    input.id = 'civic-hall-keywords';
                  }
                  var existingLabel = form.querySelector('label[for="' + input.id + '"]');
                  if (!existingLabel) {
                    var label = document.createElement('label');
                    label.setAttribute('for', input.id);
                    label.className = 'visually-hidden';
                    label.textContent = 'Search';
                    input.parentNode.insertBefore(label, input);
                  }
                  if (!input.getAttribute('aria-label') && !form.querySelector('label[for="' + input.id + '"]')) {
                    input.setAttribute('aria-label', 'Search');
                  }
                }
                var wrap = form.parentElement;
                var btn = wrap.querySelector('.civic-hall-search-toggle');
                if (!btn) {
                  btn = document.createElement('button');
                  btn.type = 'button';
                  btn.className = 'civic-hall-search-toggle';
                  btn.setAttribute('aria-label', 'Search');
                  btn.setAttribute('aria-expanded', 'false');
                  if (form.id) {
                    btn.setAttribute('aria-controls', form.id);
                  }
                  wrap.insertBefore(btn, form);
                }
                document.querySelectorAll('.civic-hall-alerts').forEach(function (el) {
                  if (!el.getAttribute('role')) {
                    el.setAttribute('role', 'status');
                  }
                });
                if (document.body.classList.contains('path-search')) {
                  header.classList.add('civic-hall-search-open');
                  btn.setAttribute('aria-expanded', 'true');
                  return;
                }
                btn.addEventListener('click', function (e) {
                  e.preventDefault();
                  e.stopPropagation();
                  setOpen(header, !header.classList.contains('civic-hall-search-open'));
                });
                form.addEventListener('keydown', function (e) {
                  if (e.key === 'Escape') {
                    e.preventDefault();
                    setOpen(header, false);
                  }
                });
              }
              document.addEventListener('click', function (e) {
                if (document.body.classList.contains('path-search')) {
                  return;
                }
                document.querySelectorAll('.region-header.civic-hall-search-open').forEach(function (header) {
                  var form = header.querySelector('.views-exposed-form');
                  var btn = header.querySelector('.civic-hall-search-toggle');
                  if (form && form.contains(e.target)) {
                    return;
                  }
                  if (btn && (btn === e.target || btn.contains(e.target))) {
                    return;
                  }
                  setOpen(header, false);
                });
              });
              function init() {
                document.querySelectorAll('.region-header .views-exposed-form').forEach(setup);
              }
              if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
              }
              else {
                init();
              }
            })();
          compiled: *civic_hall_search_js
